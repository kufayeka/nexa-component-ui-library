<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>child</title></head>
<body style="margin:0;font:14px sans-serif">
<!-- An embedded page for the Iframe test: says hello with its query, echoes what it gets. -->
<div id="q"></div>
<script>
document.getElementById("q").textContent = location.search;
parent.postMessage({ hello: location.search }, "*");
window.addEventListener("message", function (e) { parent.postMessage({ echo: e.data }, "*"); });
</script>
</body></html>
